<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">
  <title>Sangyó vial label samples: 1 ml, Dior</title>
  <defs>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#7a3410"/>
      <stop offset=".45" stop-color="#c46a23"/>
      <stop offset=".6" stop-color="#e09445"/>
      <stop offset="1" stop-color="#6b2c0c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".0"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset=".35" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
  </defs>

  <rect width="1200" height="900" fill="#f3f0eb"/>
  <text x="60" y="78" font-size="30" fill="#26221f" font-family="'Cormorant Garamond', Georgia, serif">Vial label samples · 1 ml · Dior</text>
  <text x="60" y="108" font-size="15" fill="#26221f" fill-opacity=".6">Drawn 10× larger than real size. Real label: 30 × 10 mm.</text>

  <!-- A: white label -->
  <g transform="translate(60 150)" filter="url(#sh)">
    <rect width="600" height="200" rx="10" fill="#fff"/>
    <g transform="translate(36 0)">
      <text x="0" y="84" font-size="30" font-style="italic" fill="#26221f" font-family="'Cormorant Garamond', Georgia, serif">eau de</text>
      <text x="0" y="146" font-size="64" fill="#26221f" font-family="'Cormorant Garamond', Georgia, serif" letter-spacing="1">sangyó</text>
    </g>
    <line x1="258" y1="40" x2="258" y2="160" stroke="#26221f" stroke-opacity=".35" stroke-width="2"/>
    <g transform="translate(290 0)">
      <text x="0" y="86" font-size="40" font-weight="600" letter-spacing="9" fill="#26221f">DIOR</text>
      <text x="0" y="122" font-size="22" fill="#26221f" fill-opacity=".7">Sauvage · EDP</text>
      <text x="0" y="164" font-size="30" font-weight="600" fill="#26221f">1 ml</text>
    </g>
  </g>
  <text x="60" y="392" font-size="15" fill="#26221f">A · White, dark text</text>

  <!-- B: dark label -->
  <g transform="translate(60 440)" filter="url(#sh)">
    <rect width="600" height="200" rx="10" fill="#26221f"/>
    <g transform="translate(36 0)">
      <text x="0" y="84" font-size="30" font-style="italic" fill="#d9b46a" font-family="'Cormorant Garamond', Georgia, serif">eau de</text>
      <text x="0" y="146" font-size="64" fill="#f2ead8" font-family="'Cormorant Garamond', Georgia, serif" letter-spacing="1">sangyó</text>
    </g>
    <line x1="258" y1="40" x2="258" y2="160" stroke="#d9b46a" stroke-opacity=".6" stroke-width="2"/>
    <g transform="translate(290 0)">
      <text x="0" y="86" font-size="40" font-weight="600" letter-spacing="9" fill="#f2ead8">DIOR</text>
      <text x="0" y="122" font-size="22" fill="#f2ead8" fill-opacity=".7">Sauvage · EDP</text>
      <text x="0" y="164" font-size="30" font-weight="600" fill="#d9b46a">1 ml</text>
    </g>
  </g>
  <text x="60" y="682" font-size="15" fill="#26221f">B · Dark, cream and gold (matches the Discovery six card)</text>

  <!-- C: centred, minimal -->
  <g transform="translate(60 720)" filter="url(#sh)">
    <rect width="600" height="130" rx="10" fill="#fff"/>
    <text x="300" y="58" text-anchor="middle" font-size="40" fill="#26221f" font-family="'Cormorant Garamond', Georgia, serif"><tspan font-style="italic" font-size="28">eau de </tspan>sangyó</text>
    <text x="300" y="104" text-anchor="middle" font-size="24" font-weight="600" letter-spacing="5" fill="#26221f">DIOR · 1 ML</text>
  </g>
  <text x="60" y="878" font-size="15" fill="#26221f">C · Minimal, centred (no perfume name)</text>

  <!-- Mock-up: label A on a 1 ml vial, real proportions (vial ≈ 40 mm tall) -->
  <g transform="translate(820 150)">
    <text x="0" y="-10" font-size="15" fill="#26221f" fill-opacity=".7">On a 1 ml vial (label A, 3× size)</text>
    <g filter="url(#sh)">
      <rect x="95" y="20" width="110" height="140" rx="8" fill="url(#cap)"/>
      <rect x="85" y="150" width="130" height="16" rx="4" fill="#1a1a1a"/>
      <rect x="80" y="160" width="140" height="440" rx="14" fill="url(#amber)"/>
      <rect x="80" y="160" width="140" height="440" rx="14" fill="url(#glass)"/>
      <!-- label wraps the vial: only the front 30 mm × 10 mm shows, scaled to the vial width -->
      <g transform="translate(80 340) scale(0.2333 0.45)">
        <rect width="600" height="200" fill="#fff"/>
        <g transform="translate(36 0)">
          <text x="0" y="84" font-size="30" font-style="italic" fill="#26221f" font-family="'Cormorant Garamond', Georgia, serif">eau de</text>
          <text x="0" y="146" font-size="64" fill="#26221f" font-family="'Cormorant Garamond', Georgia, serif">sangyó</text>
        </g>
        <line x1="258" y1="40" x2="258" y2="160" stroke="#26221f" stroke-opacity=".35" stroke-width="2"/>
        <g transform="translate(290 0)">
          <text x="0" y="86" font-size="40" font-weight="600" letter-spacing="9" fill="#26221f">DIOR</text>
          <text x="0" y="122" font-size="22" fill="#26221f" fill-opacity=".7">Sauvage · EDP</text>
          <text x="0" y="164" font-size="30" font-weight="600" fill="#26221f">1 ml</text>
        </g>
      </g>
    </g>
    <text x="0" y="660" font-size="14" fill="#26221f" fill-opacity=".6">Tip: on round vials the label wraps,</text>
    <text x="0" y="680" font-size="14" fill="#26221f" fill-opacity=".6">so keep it 30 mm wide or less for 1 ml.</text>
  </g>
</svg>
