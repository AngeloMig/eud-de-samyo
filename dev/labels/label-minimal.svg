<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 980" width="1300" height="980">
  <title>Sangyó minimal vial label</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&amp;family=Instrument+Sans:wght@500;600&amp;family=Italiana&amp;display=swap');
    .pre { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; }
    .name { font-family: 'Italiana', 'Cormorant Garamond', Georgia, serif; }
    .sans { font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; }
    .note { font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; fill: #26221f; }
  </style>
  <defs>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/></filter>
    <linearGradient id="amber" x1="0" x2="1"><stop offset="0" stop-color="#7a3410"/><stop offset=".45" stop-color="#c46a23"/><stop offset=".6" stop-color="#e09445"/><stop offset="1" stop-color="#6b2c0c"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="cap" x1="0" x2="1"><stop offset="0" stop-color="#111"/><stop offset=".35" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>

    <!-- One label, 30 × 10 mm drawn at 20 units per mm (600 × 200).
         Three centred lines that fill the label: logo · brand + perfume · type + size. -->
    <g id="dior">
      <rect width="600" height="200" rx="8" fill="#fff"/>
      <text x="300" y="86" text-anchor="middle"><tspan class="pre" font-size="40" fill="#26221f" fill-opacity=".75">eau de </tspan><tspan class="name" font-size="84" fill="#26221f">sangyó</tspan></text>
      <text x="300" y="134" text-anchor="middle" class="sans" font-size="27" font-weight="600" letter-spacing="7" fill="#26221f">DIOR · SAUVAGE</text>
      <text x="300" y="174" text-anchor="middle" class="sans" font-size="22" font-weight="500" letter-spacing="6" fill="#26221f" fill-opacity=".62">EAU DE PARFUM · 1 ML</text>
    </g>
  </defs>

  <rect width="1300" height="980" fill="#f3f0eb"/>
  <text x="60" y="76" class="name" font-size="40" fill="#26221f">Minimal label</text>
  <text x="60" y="106" class="note" font-size="15" fill-opacity=".6">Real size 30 × 10 mm (1 &amp; 2 ml) or 40 × 14 mm (5 &amp; 10 ml), drawn 20× larger. Your fonts: Italiana for "sangyó", Cormorant Garamond italic for "eau de", Instrument Sans for the rest.</text>

  <!-- 1 ml · Dior Sauvage EDP -->
  <g transform="translate(60 150)" filter="url(#sh)"><use href="#dior"/></g>
  <text x="60" y="378" class="note" font-size="14">1 ml · Dior Sauvage, Eau de Parfum</text>

  <!-- 2 ml · Versace Eros EDT -->
  <g transform="translate(60 420)" filter="url(#sh)">
    <rect width="600" height="200" rx="8" fill="#fff"/>
    <text x="300" y="86" text-anchor="middle"><tspan class="pre" font-size="40" fill="#26221f" fill-opacity=".75">eau de </tspan><tspan class="name" font-size="84" fill="#26221f">sangyó</tspan></text>
    <text x="300" y="134" text-anchor="middle" class="sans" font-size="27" font-weight="600" letter-spacing="7" fill="#26221f">VERSACE · EROS</text>
    <text x="300" y="174" text-anchor="middle" class="sans" font-size="22" font-weight="500" letter-spacing="6" fill="#26221f" fill-opacity=".62">EAU DE TOILETTE · 2 ML</text>
  </g>
  <text x="60" y="648" class="note" font-size="14">2 ml · Versace Eros, Eau de Toilette</text>

  <!-- 10 ml · long name: Armani Stronger With You Intensely (40 × 14 mm → 800 × 280) -->
  <g transform="translate(60 690)" filter="url(#sh)">
    <rect width="800" height="250" rx="8" fill="#fff"/>
    <text x="400" y="104" text-anchor="middle"><tspan class="pre" font-size="50" fill="#26221f" fill-opacity=".75">eau de </tspan><tspan class="name" font-size="106" fill="#26221f">sangyó</tspan></text>
    <text x="400" y="164" text-anchor="middle" class="sans" font-size="25" font-weight="600" letter-spacing="3.5" fill="#26221f">ARMANI · STRONGER WITH YOU INTENSELY</text>
    <text x="400" y="214" text-anchor="middle" class="sans" font-size="27" font-weight="500" letter-spacing="7" fill="#26221f" fill-opacity=".62">EAU DE PARFUM · 10 ML</text>
  </g>
  <text x="60" y="966" class="note" font-size="14">10 ml · a long name still fits on one line (40 × 14 mm label)</text>

  <!-- On a 1 ml vial -->
  <g transform="translate(940 150)">
    <text x="0" y="-12" class="note" font-size="14" fill-opacity=".7">On a 1 ml vial</text>
    <g filter="url(#sh)">
      <rect x="95" y="20" width="110" height="140" rx="8" fill="url(#cap)"/>
      <rect x="85" y="150" width="130" height="16" rx="4" fill="#1a1a1a"/>
      <rect x="80" y="160" width="140" height="440" rx="14" fill="url(#amber)"/>
      <rect x="80" y="160" width="140" height="440" rx="14" fill="url(#glass)"/>
      <g transform="translate(80 345) scale(0.2333 0.42)"><use href="#dior"/></g>
    </g>
  </g>
</svg>
